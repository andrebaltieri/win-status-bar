name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configure .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Publish App
        run: dotnet publish -c Release -r win-x64 --output ./publish
      
      - name: Compact Artifact
        run: Compress-Archive -Path ./publish/StatusBar.exe -DestinationPath ./StatusBar-Windows.zip

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: StatusBar-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}